<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Brennan O'Halloran</title>
    <link rel="icon" type="image/svg+xml" href="__BASE__favicon.svg" />
    <style>
      :root { color-scheme: light dark; --bg: #f8fafc; --fg: #1d283a; --muted: #4e5e74; --teal: #0a7c6a; --border: #d3dbe5; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d1b2e; --fg: #dfe4ee; --muted: #8b98b2; --teal: #64ffda; --border: #2a3a52; }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 2rem; background: var(--bg); color: var(--muted); font: 16px/1.6 system-ui, -apple-system, 'Segoe UI', sans-serif; }
      main { max-width: 34rem; text-align: center; }
      .code { font: 500 0.95rem ui-monospace, Consolas, monospace; color: var(--teal); margin: 0 0 0.75rem; }
      h1 { margin: 0 0 0.75rem; color: var(--fg); font-size: clamp(1.9rem, 6vw, 2.75rem); line-height: 1.15; }
      p { margin: 0 0 1.75rem; }
      a { display: inline-block; padding: 0.7rem 1.4rem; border: 1px solid var(--teal); border-radius: 8px; color: var(--teal); text-decoration: none; font: 500 0.9rem ui-monospace, Consolas, monospace; }
      a:hover, a:focus-visible { background: color-mix(in srgb, var(--teal) 12%, transparent); outline: 2px solid var(--teal); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">&gt; 404 not_found</p>
      <h1>That page doesn’t exist.</h1>
      <p>The link may be old or mistyped. Everything lives on one page, so the home page is the best place to start.</p>
      <a href="__BASE__">Back to the portfolio</a>
    </main>
  </body>
</html>
